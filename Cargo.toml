[package]
name = "fde-02-airgap-deploy"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Policy checks that keep an LLM deployment inside a private VPC: pinned internal images, default-deny networking, no public egress."
repository = "https://github.com/braylo777/fde-02-airgap-deploy"

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "fde-02-airgap-deploy"
path = "src/main.rs"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
hmac = "=0.12.1"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
codegen-units = 1
